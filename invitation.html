<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>ROUTflex | Aceitar convite</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <main class="ws-auth">
    <section class="ws-auth-card" aria-labelledby="inviteTitle">
      <div class="ws-auth-brand"><img src="assets/logo.png" alt="ROUTflex" width="40" height="40"><span><strong><span>ROUT</span>flex</strong><small>Convite para a empresa</small></span></div>
      <h1 id="inviteTitle">Validando convite…</h1>
      <p class="ws-auth-sub" id="inviteDescription" aria-live="polite"></p>
      <p class="ws-form-error" id="acceptError" role="alert" hidden></p>
      <form id="acceptForm" hidden>
        <label class="ws-field"><span>E-mail do convite</span><input id="acceptEmail" type="email" readonly autocomplete="username"></label>
        <div id="newAccountFields" hidden>
          <label class="ws-field"><span>Nome completo</span><input id="acceptFullName" name="fullName" minlength="2" maxlength="160" autocomplete="name"></label>
          <label class="ws-field"><span>Crie sua senha (mínimo de 12 caracteres)</span><input id="acceptPassword" name="password" type="password" minlength="12" autocomplete="new-password"></label>
        </div>
        <button type="submit" id="acceptSubmit">Aceitar convite</button>
      </form>
      <p id="acceptSuccess" role="status" hidden>Convite aceito. Entre no Workspace com sua conta para acessar a empresa.</p>
      <p><a href="workspace.html" id="workspaceLink">Ir para o Workspace</a></p>
    </section>
  </main>
  <script src="core-client.js"></script>
  <script src="invitation.js"></script>
</body>
</html>
